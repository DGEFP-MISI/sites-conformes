name: 📦 Docker Image Build & Push

on:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  docker:
    if: github.repository == 'numerique-gouv/sites-conformes'
    runs-on: ubuntu-latest
    name: Build and push Docker image
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Inject enhanced GitHub environment variables
        uses: rlespinasse/github-slug-action@0e3299190dac9a700da92a90de4556116ea965ed # v5
      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Extract tag without leading v
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "TAG_NO_V=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          push: true
          tags: |
            ghcr.io/${{ env.GITHUB_REPOSITORY_OWNER_PART_SLUG }}/sites-conformes:${{ env.GITHUB_REF_SLUG }}
            ${{ env.TAG_NO_V && format('ghcr.io/{0}/sites-conformes:latest', env.GITHUB_REPOSITORY_OWNER_PART_SLUG) || '' }}
            ${{ env.TAG_NO_V && format('ghcr.io/{0}/sites-conformes:{1}', env.GITHUB_REPOSITORY_OWNER_PART_SLUG, env.TAG_NO_V) || '' }}
          cache-from: type=registry,ref=ghcr.io/${{ env.GITHUB_REPOSITORY_OWNER_PART_SLUG }}/sites-conformes:${{ env.GITHUB_REF_SLUG }}
          cache-to: type=inline
